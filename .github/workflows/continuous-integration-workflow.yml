name: gekkoboot build

on: [workflow_dispatch]

jobs:
  build:
    name: Build gekkoboot
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential meson/bookworm-backports 7zip/bookworm-backports clang-format-16

    - name: Checkout gekkoboot
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch Qoob prebuilt
      run: curl -Lo res/ipl.rom https://github.com/redolution/gekkoboot/releases/download/r5.2/iplboot.gcb

    - name: Inspect devkitPPC lock definitions
      run: |
        export PATH="$DEVKITPPC/bin:$PATH"

        echo "=== Compiler ==="
        powerpc-eabi-gcc --version | head -n 1

        echo "=== Newlib configuration ==="
        echo '#include <newlib.h>' | powerpc-eabi-gcc -E -dM -x c - | grep -E 'LOCK|THREAD' || true

        echo "=== Recursive lock type ==="
        printf '#include <sys/lock.h>\n_LOCK_RECURSIVE_T test_lock;\n' \
          | powerpc-eabi-gcc -E -P -x c - | tail -n 35

        echo "=== Installed lock headers ==="
        find /opt/devkitpro/devkitPPC -path '*/sys/lock.h' -print \
          -exec sed -n '1,120p' {} \;

    - name: Build gekkoboot
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        export PATH="$DEVKITPPC/bin:$PATH"
        meson setup . build --cross-file=devkitPPC.ini -Dfull_rom='enabled'
        meson compile -C build
        ninja -C build clang-format-check

    - name: Show libogc2 build errors
      if: failure()
      run: |
        cat build/meson-logs/libogc2-build.log

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gekkoboot
        path: build
        include-hidden-files: true
